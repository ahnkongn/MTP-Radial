/*ENDFONTS*/
*,*::before,*::after{box-sizing:inherit}
:root{--edge:rgba(77,255,136,.42);--edge2:rgba(77,255,136,.2);--glass:linear-gradient(180deg,rgba(16,62,36,.72),rgba(4,26,14,.9));--glow:0 0 14px rgba(77,255,136,.12)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ph);
  font-family:var(--f14);font-size:14px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:radial-gradient(130% 60% at 50% -8%,#07260f 0%,#010503 62%) fixed;text-shadow:0 0 5px rgba(77,255,136,.4)}
button{font:inherit;color:inherit;text-shadow:inherit}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;
  border-inline:1px solid rgba(77,255,136,.1);box-shadow:0 0 50px rgba(0,0,0,.7)}
#hud{display:none;gap:10px;align-items:center;justify-content:space-between;margin:8px 10px 0;padding:8px 14px;border:1px solid var(--edge2);border-radius:16px;
  background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.45);font-size:13px;font-family:var(--f11);white-space:nowrap}
#hud .hp{display:flex;align-items:center;gap:7px}
.hpbar{display:inline-block;width:92px;height:11px;border:1px solid rgba(77,255,136,.55);border-radius:999px;padding:1px;background:#021a0d;overflow:hidden}

<script>

const W=520,CAST_R=88,MAX_FLOORS=14;   // 전장 폭 520: 적이 훨씬 멀리서 오므로 사거리가 의미를 가진다
let H=380,GY=340;                       // 세로는 기기 화면에 맞춰 전투 시작 때 정한다

const CRIT_BASE=.07,CRIT_MUL=1.6;       // 치명타 기본 확률/배율

const HPT=[1,1.25,1.55,2.0,2.8,3.4,5.0],NT=[14,20,25,30,40,47,64],DT=[1,1.1,1.2,1.35,1.5,1.65,1.8];

// 졸개(일반 몬스터) 물량: 많이 나오는 대신 한 마리는 약하다 — 한꺼번에 쓸어 담는 재미. 코어·과부하·콤보 보상은 마릿수에 맞춰 마리당 줄여서 경제는 그대로 둔다.
// 졸개는 7줄로 흩어져 몰려온다(줄마다 4px 위로). 연출 전용이며 사거리·피해는 x 거리만 본다. 이펙트의 y도 이 줄 높이를 따라간다.
const LANES=7,LANE_PX=4,lanePx=e=>((e&&e.lane)||0)*LANE_PX;
const MINION_K=3.3,MINION_HP=.6,INF_K=5.2,INF_HP=.25;
// 1막 초반(앞의 몇 구간)은 타워가 적으니 물량을 천천히 늘린다: 1막: 1구간 1.0배 → 5구간부터 1.8배. 2막부터는 처음부터 3.3배.
const mkOf=(A,L)=>A>0?MINION_K:1+(1.8-1)*Math.min(1,Math.max(0,L-1)/4);   // 1막은 타워가 적어 1.8배까지만, 2막부터 3.3배
// i번째(전체 n마리) 졸개를 cl개의 무리 중 하나로 묶어 [t0,t1] 구간에 투입한다. 무리 하나는 bl초 안에 몰려온다.
function packT(i,n,t0,t1,cl,bl){const sz=Math.max(1,Math.ceil(n/cl)),c=Math.floor(i/sz),j=i%sz,per=(t1-t0)/cl;return t0+c*per+(j/sz)*Math.min(bl,per*.6)+rnd(0,.25);}
const mobK=B=>(B&&B.mk)||MINION_K;
const isMob=e=>!(e.d.boss||e.d.elite||e.champ||e.d.gold);
const infKind=w=>w%10===0?'boss':w%5===0?'elite':'battle';
function infW(w){const dm=1+.06*(((S&&S.diff)||1)-1);return {hp:1.8*Math.pow(1.125,w)*dm,dmg:1.15*Math.pow(1.055,w),armor:Math.floor(w/4),spd:1+Math.min(.4,.006*w)};}
function planInf(kind,w){
 const sp=[];
 const pk=()=>{const r=Math.random()*100,sh=Math.min(28,8+w*.8),dr=Math.min(24,10+w*.5),md=Math.min(12,4+w*.3);
  if(r<sh)return 'imp_shield';if(r<sh+dr)return 'imp_drone';if(r<sh+dr+md)return 'imp_medic';if(r<sh+dr+md+18)return 'imp_scout';return 'imp_soldier';};
 if(kind==='boss'){
  const mc=Math.round(Math.min(300,80+2*w)*BT*INF_K),T1=54*BT,TB=36*BT;
  for(let i=0;i<mc;i++)sp.push({t:packT(i,mc,2,T1,9+Math.floor(w/10),8),k:pk()});
  sp.push({t:TB,k:'imp_general'});
  const ne=3+Math.floor(w/10);
  for(let i=0;i<ne;i++)sp.push({t:10*BT+(TB-16*BT)*(i+.5)/ne,k:i%2?'imp_gunship':'imp_walker',champ:1,ck:.5});
 }else if(kind==='elite'){
  const n=Math.round(Math.min(280,70+2*w)*BT*INF_K),dur=(34+Math.min(30,w*.5))*BT*1.7;
  for(let i=0;i<n;i++)sp.push({t:packT(i,n,1,1+dur,8+Math.floor(w/8),7),k:pk()});
  const cnt=Math.min(8,2+Math.floor(w/5));
  for(let j=0;j<cnt;j++)sp.push({t:(12+j*7)*BT,k:j%2?'imp_gunship':'imp_walker',champ:1});
 }else{
  const n=Math.round(Math.min(360,70+3*w)*BT*INF_K),dur=(33+Math.min(30,w*.6))*1.7*BT;
  for(let i=0;i<n;i++)sp.push({t:packT(i,n,1.5,1.5+dur,Math.min(14,8+Math.floor(w/6)),6+Math.min(6,Math.floor(w/5))),k:pk()});
  const nc=Math.min(3,Math.floor(w/4));
  for(let i=0;i<nc;i++)sp.push({t:dur*(.25+.55*(i+.5)/nc),k:i%2?'imp_gunship':'imp_walker',champ:1,ck:.38});
  if(Math.random()<.3*(has('goldradar')?2:1))sp.push({t:dur*rnd(.3,.7),k:'goldbug'});
 }
 sp.sort((a,b)=>a.t-b.t);return sp;
}

function cloudPush(){
 if(!CLOUD.ref||CLOUD.state==='conflict'||CLOUD.state==='init')return;
 clearTimeout(CLOUD.timer);
 CLOUD.timer=setTimeout(cloudPushNow,1200);
}
async function cloudPushNow(force){
 if(!CLOUD.ref)return false;
 try{
  if(!force){
   const snap=await CLOUD.ref.get(),cd=snap.exists?snap.data():null;
   if(cd&&cd.code&&cd.code!==metaToCode()&&(+cd.ts||0)>(META.syncTs||0)){   // 다른 기기가 그 사이에 올린 기록이 있다: 덮어쓰지 않고 선택을 받는다
    const cm=codeToMeta(cd.code);
    if(cm){CLOUD.state='conflict';CLOUD.pending={meta:cm,ts:+cd.ts||0};cloudUiRefresh();return false;}
   }
  }
  await CLOUD.ref.set({v:1,ts:META.ts,code:metaToCode()});META.syncTs=META.ts;persist();CLOUD.last=Date.now();CLOUD.state='ok';cloudUiRefresh();return true;
 }catch(e){CLOUD.state='err';cloudUiRefresh();return false;}
}
async function cloudReconcile(){
 if(!CLOUD.ref||CLOUD.busy)return;
 CLOUD.busy=true;
 try{
  const snap=await CLOUD.ref.get(),cd=snap.exists?snap.data():null,cm=cd&&cd.code?codeToMeta(cd.code):null;
  const cts=cd?(+cd.ts||0):0,lts=META.ts||0,syn=META.syncTs||0;
  if(!cm){CLOUD.state='ok';if(hasProgress())await cloudPushNow();}
  else if(cd.code===metaToCode()){META.syncTs=Math.max(syn,cts);persist();CLOUD.state='ok';CLOUD.last=Date.now();}
  else{
   const lch=lts>syn,cch=cts>syn;   // 이 기기에서 마지막 동기화 뒤 바뀜 / 클라우드가 마지막 동기화 뒤 바뀜
   if(!hasProgress()||(!lch&&cch)){applyMeta(cm);META.ts=cts;META.syncTs=cts;persist();CLOUD.state='ok';CLOUD.last=Date.now();}
   else if(lch&&!cch){await cloudPushNow();}
   else if(!lch&&!cch){CLOUD.state='ok';}
   else{CLOUD.state='conflict';CLOUD.pending={meta:cm,ts:cts};}
  }
 }catch(e){CLOUD.state='err';}
 CLOUD.busy=false;cloudUiRefresh();
}
async function initCloud(){
 try{
  const C=window.claude;if(!C||typeof C.use!=='function'){CLOUD.state='off';cloudUiRefresh();return;}
  const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
  if(!db||!user){CLOUD.state='off';cloudUiRefresh();return;}
  const id=await user.id();if(!id){CLOUD.state='off';cloudUiRefresh();return;}
  CLOUD.ref=db.doc('data/users/'+id+'/save');
  await cloudReconcile();

 }catch(e){CLOUD.state='off';cloudUiRefresh();}
}

function makeIR(c,sec,decay){

function buildAudio(c){

 // 필수 구성: 버스 + 마스터. 아래 리미터·리버브는 실패해도 소리는 나도록 따로 감싼다.

 SND.bgm=c.createGain();SND.sfx=c.createGain();SND.duck=c.createGain();
 SND.bgm.connect(SND.duck);SND.duck.connect(SND.master);SND.sfx.connect(SND.master);

}

function tone(type,f0,f1,dur,vol,delay,bus){

 if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol,lp,hp,delay,bus){

 const t=c.currentTime+(delay||0),s=c.createBufferSource();s.buffer=SND.noiseBuf;s.loop=true;

 if(hp){const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;n.connect(f);n=f;}
 if(lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;n.connect(f);n=f;}
 const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

}

 }

 }
}

function awakeVideo(){
 if(AWAKE.video)return AWAKE.video;
 const v=document.createElement('video');
 for(const [k,val] of [['playsinline',''],['webkit-playsinline',''],['muted',''],['autoplay',''],['disablepictureinpicture',''],['x-webkit-airplay','deny'],['aria-hidden','true']])v.setAttribute(k,val);
 v.muted=true;v.defaultMuted=true;v.loop=true;v.tabIndex=-1;
 // 일부 브라우저는 너무 작거나 안 보이는 영상을 '재생 중'으로 쳐 주지 않는다 → 256x256 크기로 화면 안에 두고 거의 투명하게 만든다
 v.style.cssText='position:fixed;right:0;bottom:0;width:256px;height:256px;opacity:.015;pointer-events:none;z-index:0';
 for(const [src,type] of [[WAKE_MP4,'video/mp4'],[WAKE_WEBM,'video/webm']]){const so=document.createElement('source');so.src=src;so.type=type;v.appendChild(so);}
 v.addEventListener('pause',()=>{if(S&&AWAKE.on&&!AWAKE.lock&&document.visibilityState==='visible'){try{v.play().catch(()=>{});}catch(e){}}});
 document.body.appendChild(v);AWAKE.video=v;return v;
}
async function awakeRequest(){
 if(!AWAKE.on||!S)return;
 try{
  if(!navigator.wakeLock||!navigator.wakeLock.request)AWAKE.info.lock='없음';
  else if(!AWAKE.lock&&document.visibilityState!=='hidden'){
   const l=await navigator.wakeLock.request('screen');
   AWAKE.lock=l;AWAKE.mode='lock';AWAKE.info.lock='작동';
   if(l.addEventListener)l.addEventListener('release',()=>{if(AWAKE.lock===l){AWAKE.lock=null;if(AWAKE.mode==='lock')AWAKE.mode='';}});
  }
 }catch(e){AWAKE.info.lock='차단됨';}
 if(AWAKE.lock){try{if(AWAKE.video)AWAKE.video.pause();}catch(e){}return;}   // 잠금이 잡혔으면 영상은 필요 없다
 try{
  const v=awakeVideo();
  if(v.paused){
   const pr=v.play();
   if(pr&&pr.then)pr.then(()=>{AWAKE.mode='video';AWAKE.info.video='재생 중';},()=>{AWAKE.info.video='차단됨';});
   else{AWAKE.mode='video';AWAKE.info.video='재생 중';}
  }else{AWAKE.mode='video';AWAKE.info.video='재생 중';}
 }catch(e){AWAKE.info.video='차단됨';}
}

}

  i++;el.textContent=txt.slice(0,i);if(i%2===0)tick();

 layers.push([{id:NL_N+'-0',layer:NL_N,col:0,x:.5,type:'boss',next:[],jx:0,jy:0}]);
 // 각 노드는 다음 구간의 2갈래로 이어진다(끊긴 길 없음)
 for(let l=0;l<NL_N-1;l++){

  if(A.length===2){A[0].next=[N[0].id,N[1].id];A[1].next=[N[2].id,N[3].id];continue;}
  if(A.length===4&&N.length===5){A.forEach((n,j)=>{n.next=[N[j].id,N[j+1].id];});continue;}
  A.forEach((n,j)=>{const pr=j===0?[0,1]:j===A.length-1?[j-1,j]:pick([[j-1,j],[j,j+1]]);n.next=pr.map(t=>N[t].id);});

  if(UI.tsel===best.t.id){UI.tsel=null;if(UI.rselTap)UI.rsel=null;UI.rselTap=false;}
  else{UI.tsel=best.t.id;UI.rsel=best.t.key;UI.rselTap=true;sfxPlay('click');}

function drawRanges(g,B){
 if(!UI.rall&&UI.rsel==null)return;
 g.save();g.textAlign='center';g.textBaseline='bottom';
 const lbl=new Set();
 for(const o of B.towers){
  if(!o.range)continue;
  const sel=UI.rsel===o.t.key;if(!UI.rall&&!sel)continue;
  const acc=TCOL[tagOf(o.t)],R=o.range+CORE_PX;
  if(sel){
   g.globalAlpha=.10;g.fillStyle=acc;g.beginPath();g.arc(RC.x,RC.y,R,0,TAUR);g.fill();
   g.globalAlpha=.85;g.strokeStyle=acc;g.lineWidth=2;g.setLineDash([6,5]);g.beginPath();g.arc(RC.x,RC.y,R,0,TAUR);g.stroke();g.setLineDash([]);
   g.globalAlpha=.4;g.lineWidth=1;g.beginPath();g.moveTo(o.sx,o.sy);g.lineTo(RC.x,RC.y);g.stroke();
   g.font='bold '+Math.round(11*K)+"px 'GM14','Noto Sans KR',monospace";g.lineWidth=3;g.strokeStyle='#021008';g.globalAlpha=1;g.fillStyle=acc;
   const base=o.d.range||0,pct=base?Math.round((o.range/base-1)*100):0,lab=`${o.d.n} ${Math.round(o.range)}${pct?` (+${pct}%)`:''}`;
   if(!lbl.has(o.t.key)){lbl.add(o.t.key);const ly=Math.max(14,RC.y-R-4);g.strokeText(lab,RC.x,ly);g.fillText(lab,RC.x,ly);}
  }else{
   g.globalAlpha=.35;g.strokeStyle=acc;g.lineWidth=1;g.beginPath();g.arc(RC.x,RC.y,R,0,TAUR);g.stroke();
  }
 }
 g.restore();

function renderLog(){const l=$('#b-log');if(!l||!BATTLE)return;l.textContent=BATTLE.log.join('\n');l.scrollTop=l.scrollHeight;}
const SPEEDS=[1,2,3,4,6];
function loop(ts){
 raf=requestAnimationFrame(loop);
 const B=BATTLE;if(!B)return;
 const dt=Math.min(.1,(ts-last)/1000);last=ts;
 // 연출용 타이머는 배속과 상관없이 실제 시간으로 흐른다
 if(B.banners&&B.banners.length){for(const b of B.banners)b.t+=dt;B.banners=B.banners.filter(b=>b.t<b.max);}
 if(B.comboPulse>0)B.comboPulse-=dt;if(B.scrFlash>0)B.scrFlash=Math.max(0,B.scrFlash-dt*1.6);
 const sf=B.slowT>0?B.slowF:1;if(B.slowT>0)B.slowT-=dt;
 if(!B.paused&&!B.done){
  acc+=dt*B.speed*sf;
  const tt=performance.now();
  while(acc>=1/60){stepBattle(B,1/60);acc-=1/60;if(B.done)break;if(performance.now()-tt>15){acc=Math.min(acc,1/60);break;}}
  if(B.events.length){while(B.events.length)B.log.push('> '+B.events.shift());if(B.log.length>80)B.log.splice(0,B.log.length-80);renderLog();}
  while(B.snd.length){const q=B.snd.shift();if(Array.isArray(q))sfxPlay(q[0],q[1]);else sfxPlay(q);}
  if(B.warn&&!B.warnV){B.warnV=1;vibPat([90,60,90,60,220]);}
  if(B.hitFlash>.1){const nv=performance.now();if(nv-(B.lastHv||0)>1800){B.lastHv=nv;vib(25);}}
 }
 draw(B);
 if(UI.bp&&UI.bpOpen.dps&&++bpTick%30===0)tickBPanel();
 if(UI.tsel!=null&&++twTick%20===0)renderTowerTip();
 if(++hudTick%3===0){hud();const o=$('#b-over');if(o){
   const od=Math.max(0,Math.min(100,B.od||0)),ready=od>=100&&B.over<=0;
   const k=B.over>0?Math.ceil(B.over)+'s':ready?'준비!':Math.floor(od)+'%';
   if(o.dataset.k!==k){o.dataset.k=k;o.innerHTML='<span class="od-l">과부하</span><span class="od-p">'+k+'</span>';}
   o.style.background=B.over>0?'rgba(255,193,77,.3)':`linear-gradient(90deg,rgba(255,193,77,.4) ${od}%,rgba(77,255,136,.07) ${od}%)`;
   o.classList.toggle('odready',ready);}}
 if(B.done&&!B.ended){B.ended=true;setTimeout(()=>endBattle(B),900);}
}
function endBattle(B){

 cancelAnimationFrame(raf);BATTLE=null;UI.battle=null;
 const gain=Math.round(B.cores);S.kills+=B.kills;
 sfxPlay(B.done==='lose'?'lose':'win');
 if(B.done==='lose'){S.scr=null;clearRun();hud();return S.inf?showInfEnd():showEnd(false);}
 const bonus=B.kind==='elite'?35+10*(S.act||0):B.kind==='boss'?0:6,notes=[];
 S.cores+=gain+bonus;
 S.rwN=3;
 if(B.kind==='elite'||B.kind==='boss'){S.rwN=4;if(B.kind==='elite'){S.rolls=Math.min(maxRolls(),S.rolls+1);notes.push(`정예 격파 보상: 코어 +${bonus} · 리롤 +1 · 유물·타워 선택지 4개`);}else notes.push('보스 격파 보상: 유물·타워 선택지 4개');}
 // 승리 시 효과: 자동 수리 장치(보스전 포함 모든 승리) / 성장형 유물

  const r=RELICS.find(x=>x.id===gr.id),g=GROW[gr.id];
  notes.push(g.unit==='hp'?`${r.n}: 최대 체력 +${Math.round(gr.after-gr.before)} (현재 +${gr.after})`:`${r.n}: +${Math.round(gr.before*1000)/10}% → +${Math.round(gr.after*1000)/10}%`);
 }
 {const rc=[];if(B.comboMax>=10)rc.push('최대 콤보 ×'+B.comboMax);if(B.crits>0)rc.push('치명타 '+B.crits+'회');if(B.jackpots)rc.push('잭팟 '+B.jackpots+'회');if(B.odCount)rc.push('과부하 '+B.odCount+'회');if(B.goldMiss)rc.push('황금 벌레 놓침 '+B.goldMiss);if(rc.length)notes.push(rc.join(' · '));}
 if(B.kind==='boss'&&S.act<2)notes.push(S.act===0?'융합수의 마지막 울음이 이상하게 낯익다. (감정 모듈 신호 +1)':'"…돌아와." 천년수의 비명이 한 단어로 들린다. (감정 모듈 신호 +1)');
 if(!S.spentFlag)S.frugal=(S.frugal||0)+1;S.spentFlag=false;
 if(has('interest')){const iv=Math.floor(Math.max(0,S.cores)*.03);if(iv>0){S.cores+=iv;notes.push('복리 금고: 이자 코어 +'+iv);}}
 S.od=Math.max(0,Math.min(100,Math.round(B.od||0)));if(S.od>0)notes.push(`과부하 게이지 ${S.od}% 이월 (다음 전투를 이 수치로 시작)`);
 S.lastGain={gain,bonus,kills:B.kills,notes};S.scr={t:'queue'};hud();

function rewardPool(){return Array.from(new Set(BASE_POOL));}
function showTowerReward(first){

 const isFirst=!S.towers.length,owned=S.towers.map(t=>t.key),pool=isFirst?FIRST_POOL:rewardPool();

 const opts=[];let g=0;while(opts.length<((S.rwN||3)+(has('scout')?1:0))&&g++<60){const k=pick(bag);if(!opts.includes(k))opts.push(k);}
 // 보유 중인 타워가 선택지에 최소 1개는 나온다(1성이 이미 있는 종류를 우선: 합성 진행에 도움)

   const prog=have.filter(k=>S.towers.some(t=>t.key===k&&t.star===1));

 }

  opts.map((k,i)=>tcardC(k,i)).join('')+
  `<div class="btnrow"><button class="btn" data-act="rerollRw" ${S.rolls<=0?'disabled':''}>선택지 리롤 · 남은 ${S.rolls}/${maxRolls()}</button>${isFirst?'':'<button class="btn" data-act="skipReward">보급 거절 · 코어 +4</button>'}</div><p class="dim" style="margin:2px 0 0">막이 끝나면 리롤이 2회 충전됩니다.</p></div>`);
}

function makeShop(buys){
 const pool=rewardPool(),items=[];
 for(let i=0;i<2;i++)items.push({k:pick(pool),star:1,base:shopBase(1)});
 items.push({k:pick(pool),star:2,base:shopBase(2)});
 const rp=RELICS.filter(relicOk),rel=[];
 while(rel.length<2&&rp.length){const pk=rp.splice(Math.floor(Math.random()*rp.length),1)[0];rel.push({r:pk,cost:Math.round((32+Math.floor(Math.random()*13))*(1+.12*(S.act||0)))});if(PAIR[pk.id]){const pi=rp.findIndex(x=>x.id===PAIR[pk.id]);if(pi>=0)rp.splice(pi,1);}}
 S.shop={items,relics:rel,rerolls:0,buys:buys||0};
 for(const it of items)it.cost=shopCost(it);
}

const TKEYS=Object.keys(TOWERS).concat(Object.keys(FUSED));
function sortTowers(mode){
 const kidx=k=>TKEYS.indexOf(k),tg=t=>TAGS.indexOf(tagOf(t)),cnt={};
 for(const t of S.towers)cnt[t.key]=(cnt[t.key]||0)+1;
 const cmp={
  name:(a,b)=>kidx(a.key)-kidx(b.key)||b.star-a.star,
  star:(a,b)=>b.star-a.star||kidx(a.key)-kidx(b.key),
  count:(a,b)=>cnt[b.key]-cnt[a.key]||kidx(a.key)-kidx(b.key)||b.star-a.star,
  tag:(a,b)=>tg(a)-tg(b)||kidx(a.key)-kidx(b.key)||b.star-a.star
 }[mode]||(()=>0);
 S.towers=S.towers.map((t,i)=>[t,i]).sort((x,y)=>cmp(x[0],y[0])||x[1]-y[1]).map(x=>x[0]);
}
function autoSortIfOn(){try{if(META.autoSort&&S&&S.towers&&S.towers.length)sortTowers(META.sortMode||'name');}catch(e){}}

function mergeHintsHtml(){
 const g={},rows=[];
 for(const t of S.towers){const d=DEF(t.key);if(d.fused||t.star>=3)continue;const k=t.key+'|'+t.star+'|'+tagOf(t);(g[k]=g[k]||{key:t.key,star:t.star,n:0}).n++;}
 for(const k in g){const x=g[k];if(x.n>=2)rows.push(`<div><b>${DEF(x.key).n}</b> ${stars(x.star)} ${x.n}/3 <span class="warn">→ 하나 더 모으면 ${stars(x.star+1)} 합성</span></div>`);}
 for(const fk in FUSED){
  const F=FUSED[fk],[a,b]=F.from,mn=F.minStar||2,need=stars(mn);
  const best=key=>S.towers.filter(t=>t.key===key&&t.star>=mn&&t.star<=3).sort((p,q)=>q.star-p.star)[0];
  const ma=best(a),mb=best(b);
  if(!S.towers.some(t=>t.key===a)&&!S.towers.some(t=>t.key===b))continue;
  if(ma&&mb)rows.push(`<div><b>${F.n}</b> <span class="warn">이종 합성 가능!</span> ${DEF(a).n} ${stars(ma.star)} + ${DEF(b).n} ${stars(mb.star)} <button class="btn sm" data-act="fuse" data-id="${ma.id}" data-out="${fk}" style="min-height:32px;padding:2px 14px;margin:2px 0">합성</button></div>`);
  else rows.push(`<div class="faint">${F.n}: ${DEF(a).n} ${ma?need+' ✔':need+' 필요'} + ${DEF(b).n} ${mb?need+' ✔':need+' 필요'}</div>`);
 }
 if(!rows.length)return '';
 return `<div class="panel"><div class="tn">합성 현황</div><div style="font-size:12px;font-family:var(--f11)">${rows.join('')}</div></div>`;
}

 return `<div class="panel"><div class="tn">작전</div>${c?`<div class="warn" style="margin:6px 0">${c==='restart'?'현재 작전을 버리고 처음부터 다시 시작할까요?':'타이틀로 나갈까요?'} ${c==='restart'?'(진행 상황과 이번 작전의 보상은 사라집니다)':'(진행 상황은 저장되어 타이틀의 이어하기로 계속할 수 있습니다. 전투 중이었다면 그 전투는 처음부터 다시 시작합니다.)'}</div><button class="btn sm" data-act="confirmYes">네, 진행</button><button class="btn sm" data-act="confirmNo">취소</button>`:`<button class="btn sm" data-act="askRestart">처음부터 재시작</button><button class="btn sm" data-act="askTitle">타이틀로</button>`}</div>`;
}
const ICONS={};
function towerIcon(key,star){
 const id=key+'|'+star;if(ICONS[id]!==undefined)return ICONS[id];
 try{
  const c=document.createElement('canvas');c.width=132;c.height=58;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const oo={t:{key,star},d:DEF(key),flash:0,stun:0};drawFloor(g,oo,10,48,1.7);drawFloorDeco(g,oo,10,48,1.7);
  ICONS[id]=c.toDataURL('image/png');
 }catch(e){ICONS[id]='';}
 return ICONS[id];
}
function fuseAvail(){
 const out=[],seen=new Set();
 if(!S||!S.towers)return out;
 for(const t of S.towers)for(const f of fusionOptions(t)){
  const a=Math.min(t.id,f.partner.id),b=Math.max(t.id,f.partner.id),k=f.out+':'+a+'-'+b;
  if(seen.has(k))continue;seen.add(k);out.push({k,out:f.out,t,partner:f.partner});
 }
 return out;
}
function showFuseModal(av){
 const m=$('#modal');if(!m)return;
 const byOut={};av.forEach(x=>{if(!byOut[x.out])byOut[x.out]=x;});
 m.innerHTML=`<div class="modal-card"><h2>✦ 합성 가능!</h2><div class="dim" style="margin-bottom:6px">같은 막에서 재료가 갖춰졌습니다. 합성하면 두 타워가 하나의 4성 타워가 됩니다. 전투 중에는 합성할 수 없습니다.</div>`+
  Object.values(byOut).map(x=>recipeCard(x.out)+`<button class="btn" data-act="fuseModal" data-id="${x.t.id}" data-out="${x.out}" style="margin:-2px 0 8px">${FUSED[x.out].n} 합성하기</button>`).join('')+
  `<button class="btn" data-act="modalClose">나중에<small>성 구조 창에서 언제든 합성할 수 있습니다</small></button></div>`;
 m.hidden=false;sfxPlay('pick');
}
function closeModal(){const m=$('#modal');if(m){m.hidden=true;m.innerHTML='';}}
function checkFuse(){
 if(!S||UI.battle||UI.story)return;
 const av=fuseAvail();S.fnote=S.fnote||{};
 const fresh=av.filter(x=>!S.fnote[x.k]);
 av.forEach(x=>{S.fnote[x.k]=1;});
 if(fresh.length)showFuseModal(av);
}
function recipeCard(fk){
 const F=FUSED[fk],[a,b]=F.from,mn=F.minStar||3;
 const own=k=>!!S&&S.towers.some(t=>t.key===k&&t.star>=mn&&t.star<=3);
 const best=k=>S?Math.max(0,...S.towers.filter(t=>t.key===k).map(t=>t.star)):0;
 const ready=own(a)&&own(b);
 const ing=k=>`<div class="rc-ing"><img src="${towerIcon(k,mn)}" alt="${DEF(k).n}"><div class="rc-n ${own(k)?'warn':''}">${DEF(k).n}<br><span class="st">${stars(mn)}</span>${S?(own(k)?' ✔':best(k)?` <span class="faint">(보유 ${stars(best(k))})</span>`:''):''}</div></div>`;
 const eff=F.desc.replace(/^[^.]*\.\s*/,'');
 return `<div class="panel" style="${ready?'border-color:var(--warn);box-shadow:0 0 14px rgba(255,193,77,.25)':''}"><div class="rc-row">${ing(a)}<span class="rc-op">+</span>${ing(b)}<span class="rc-op">→</span><div class="rc-ing"><img src="${towerIcon(fk,4)}" alt="${F.n}"><div class="rc-n"><b>${F.n}</b><br><span class="st">${stars(4)}</span></div></div></div><div style="margin-top:6px">${chip(F.tag)}${F.gun?'<span class="chip" style="color:var(--ph)">총기</span>':''}${ready?'<span class="warn">지금 합성 가능!</span>':''}</div><div class="td" style="font-size:12px;font-family:var(--f11)">${eff}</div></div>`;
}
function recipesHtml(){
 const f=S?(UI.rfilter||'all'):'all';
 const owned=k=>!!S&&S.towers.some(t=>t.key===k);
 const full=k=>!!S&&S.towers.some(t=>t.key===k&&t.star>=3&&t.star<=3);
 let keys=Object.keys(FUSED);
 const score=k=>{const [a,b]=FUSED[k].from;return (full(a)&&full(b)?3:0)+(full(a)||full(b)?1:0)+(owned(a)||owned(b)?.5:0);};
 if(S)keys.sort((x,y)=>score(y)-score(x)||Object.keys(FUSED).indexOf(x)-Object.keys(FUSED).indexOf(y));
 if(f==='mine')keys=keys.filter(k=>{const [a,b]=FUSED[k].from;return owned(a)||owned(b);});
 const bt=(v,l)=>`<button class="btn sm" data-act="rfilter" data-v="${v}" style="min-height:34px;padding:3px 13px;${f===v?'border-color:var(--ph);background:rgba(77,255,136,.2)':''}">${l}</button>`;
 return `<h2>조합표</h2><p class="dim" style="font-size:12px;font-family:var(--f11)">같은 성급(★★★) 타워 두 종을 합성하면 4성 합성 타워가 됩니다. 총 ${Object.keys(FUSED).length}종.${S?' 합성 가능한 조합이 위에 표시됩니다.':''}</p>${S?`<div>${bt('all','전체 조합')}${bt('mine','내 재료만')}</div>`:''}${keys.length?keys.map(recipeCard).join(''):'<p class="dim">가진 재료가 들어가는 조합이 아직 없습니다.</p>'}<button class="btn" data-act="closeSheet">닫기</button>`;
}

 if(UI.sheet==='sound'){

  <div class="panel"><div class="row2"><span>배경음악</span><b id="v-bgm">${pc('bgm')}%</b></div><input type="range" min="0" max="100" value="${pc('bgm')}" data-vol="bgm" aria-label="배경음악 볼륨" style="width:100%;min-height:36px;accent-color:var(--ph)"></div>

  <div class="panel"><div class="row2"><span>다른 앱 소리와 함께 재생</span><b>${AUDIO_MIX?'켬':'끔'}</b></div><button class="btn sm" data-act="mixToggle">${AUDIO_MIX?'독점 모드로 바꾸기':'함께 재생으로 바꾸기'}</button><div class="faint" style="font-size:11px;font-family:var(--f11);margin-top:4px">${AUDIO_MIX?'유튜브·음악 앱의 소리를 방해하지 않습니다. 단, 아이폰 무음 스위치가 켜져 있으면 게임 소리도 나지 않습니다.':'게임이 소리를 독점합니다. 무음 스위치가 켜져 있어도 소리가 나지만 다른 앱의 소리는 줄거나 멈춥니다.'}</div></div>

   ${S?'':'<button class="btn" data-act="actStories">막 이야기 다시 보기<small>1~3막 소개와 보스 처치 후 장면</small></button>'}
   ${S?'':'<button class="btn" data-act="story">프롤로그 다시 보기<small>세계관과 작전 목표를 다시 확인합니다</small></button>'}
  ${S||!(META.endA||META.endB)?'':'<button class="btn" data-act="endingReplay">엔딩 다시 보기<small>발견한 엔딩의 장면을 다시 봅니다</small></button>'}
  <button class="btn" data-act="sndMode">출력: ${SND_LABEL[SND.mode]}<small>누르면 전체 → 효과음만 → 끔 순서로 바뀝니다</small></button>
  <p class="faint" style="font-size:12px;font-family:var(--f11)">소리가 안 나면 기기 볼륨과 무음 스위치를 확인하세요.${UI.sheetPaused?' (전투는 일시정지됨)':''}</p>
  <button class="btn" data-act="closeSheet">닫기</button>`;
  return;
 }
 if(!S)return;
 if(UI.sheet==='relic'){
  sh.innerHTML=`<h2>유물 (${S.relics.length}/${RELICS.length})</h2>`+(S.relics.length?S.relics.map(id=>{const r=RELICS.find(x=>x.id===id);return `<div class="panel">${relicHtml(r)}</div>`;}).join(''):'<p class="dim">보유한 유물이 없습니다. 정예 전투·상점·이벤트에서 얻을 수 있습니다.</p>')+`<button class="btn" data-act="closeSheet">닫기</button>`;

const ACT={
 title(){showTitle();},
actStories(){closeSheet(true);replayActStories();},
resume(){resumeRun();},
 favs(){if(S){openSheet('favs');return;}closeSheet(true);showFavs();},
 favClear(){FAV.clear();saveFav();favDom();},
 fav(d){toggleFav(d.k);},
 start(){if(loadRunData()&&!UI.startArm){UI.startArm=true;toast('한 번 더 누르면 진행 중인 작전이 사라집니다');setTimeout(()=>{UI.startArm=false;},3000);return;}UI.startArm=false;const go=()=>{if((META.tier||1)>1)showDiffSelect();else{META.sel=1;newRun();}};if(!storySeen()){showStory(go);return;}go();},
 storyNext(){const st=UI.story;if(!st)return;if(performance.now()<(st.lock||0))return;if(CUR){skipTyping();st.lock=performance.now()+400;return;}if(st.i<st.pages.length-1){st.i++;renderStoryPage();}else endStory();},
 storySkip(){const st=UI.story;if(!st)return;
  if(!stVet()&&!st.skipArm){st.skipArm=1;const b=$('#st-skip');if(b)b.textContent='한 번 더 누르면 건너뜀';setTimeout(()=>{if(UI.story===st){st.skipArm=0;const b2=$('#st-skip');if(b2)b2.textContent=(st.mode==='ending'&&st.phase==='pre')||st.mode==='final'?'선택으로':'건너뛰기';}},3000);return;}
  if(st.mode==='final'){st.i=st.pages.length-1;renderStoryPage();return;}
  if(st.mode==='ending'&&st.phase==='pre'){st.i=END_PRE.length-1;renderStoryPage();return;}endStory();},
 endPick(d){const st=UI.story;if(!st)return;st.ending=d.v;st.pages=d.v==='A'?END_A:END_B;st.i=0;st.phase='post';renderStoryPage();},
 finalHeart(){showEnding(e=>showEnd(true,e));},

 infGo(){showBattle(infKind(S.inf.wave));},
 infShop(){S.inf.shopReady=false;S.shop=null;showShop();},
 infRec(){showInfRecord();},
 endingReplay(){closeSheet(true);showEnding(()=>showTitle());},
 story(){closeSheet(true);showStory(()=>showTitle());},
 diffPick(d){const t=Math.min(+d.t||1,META.tier||1);META.sel=t;saveMeta();newRun();},
 terminal(){showTerminal();},
 syncScreen(){showSync();},
 codeShow(){UI.codeOpen=!UI.codeOpen;redrawSync();},
 codeCopy(){const t=metaToCode();const done=()=>{UI.codeMsg={ok:true,t:'복사했습니다.'};redrawSync();};try{navigator.clipboard.writeText(t).then(done,()=>{const o=$('#codeOut');if(o){o.select();}UI.codeMsg={ok:false,t:'자동 복사가 막혀 있습니다. 위 코드를 길게 눌러 직접 복사하세요.'};redrawSync();});}catch(e){UI.codeMsg={ok:false,t:'코드를 길게 눌러 직접 복사하세요.'};redrawSync();}},
 codeLoad(){const el=$('#codeIn'),m=codeToMeta(el?el.value:'');if(!m){UI.codeMsg={ok:false,t:'올바른 저장 코드가 아닙니다. 앞의 MTP1-부터 끝까지 정확히 붙여넣으세요.'};UI.codePending=null;}else{UI.codePending=m;UI.codeMsg=null;}redrawSync();},
 codeYes(){const m=UI.codePending;if(m){applyMeta(m);saveMeta();UI.codeMsg={ok:true,t:'불러왔습니다. 포인트와 강화가 적용되었습니다.'};}UI.codePending=null;redrawSync();},
 codeNo(){UI.codePending=null;redrawSync();},
 syncNow(){cloudReconcile();},
 useCloud(){const p=CLOUD.pending;if(p){applyMeta(p.meta);META.ts=p.ts;META.syncTs=p.ts;persist();}CLOUD.pending=null;CLOUD.state='ok';CLOUD.last=Date.now();redrawSync();},

 metaUp(d){const u=META_UPS.find(x=>x.id===d.id);if(!u)return;const lv=u.get(),c=u.costs[lv];if(lv>=u.max||META.data<c)return;META.data-=c;u.set(lv+1);saveMeta();showTerminal();},

 },

  const it=S.shop.items[+d.i];if(!it||S.cores<it.cost)return;

 },
 buyRelic(d){const r=S.shop.relics[+d.i];if(!r||S.cores<r.cost)return;spendC(r.cost);giveRelic(r.r);S.shop.relics[+d.i]=null;hud();showShop('> 유물 실체화 완료: '+r.r.n);},
 repair(){const c=repairCost();if(S.cores<c)return;spendC(c);S.repairs++;S.hp=Math.min(S.maxHp,S.hp+repairAmt());hud();showShop('> 성 수리 완료. 다음 수리 비용이 증가합니다.');},
rerollShop(){

 },

 },

 const grd=g.createLinearGradient(0,0,0,GY);grd.addColorStop(0,P.s0);grd.addColorStop(1,P.s1);

 for(let layer=0;layer<2;layer++){
  g.fillStyle=layer?P.t1:P.t0;
  for(let x=-10;x<W;x+=22+r()*20){
   const h=90+r()*120+layer*20,w=6+r()*5;

   for(let k=0;k<3;k++)g.fillRect(x-8-r()*8,GY-h+k*18+r()*10,24+r()*14,8);
   if(act===1){g.fillStyle='#5a2a4a';for(let k=0;k<6;k++){const ty=GY-h+r()*h;g.fillRect(x-3,ty,3,2);g.fillRect(x+w,ty+4,3,2);}g.fillStyle=layer?P.t1:P.t0;}
  }
 }
 if(act===2){g.fillStyle='#9fffd0';for(let i=0;i<40;i++){g.globalAlpha=.15+r()*.35;g.fillRect(r()*W,r()*(GY-20),2,2);}g.globalAlpha=1;}
 g.fillStyle=P.gr;g.fillRect(0,GY,W,H-GY);
 g.fillStyle=P.ln;for(let x=0;x<W;x+=16)g.fillRect(x,GY,8,2);
 g.fillStyle=P.a;for(let i=0;i<14;i++)g.fillRect(r()*W,GY+8+r()*(H-GY-12),18+r()*20,3);
 g.fillStyle=P.b;for(let i=0;i<8;i++)g.fillRect(r()*W,GY+4+r()*10,10+r()*14,3);
 return c;
}

 const kt=kind==='boss'?'보스 웨이브 · 제국 장군 출현':kind==='elite'?'정예 웨이브 · 공성 워커와 건쉽 출현':'일반 웨이브 · 보병·방패병·드론';
 const nextBoss=10-(w%10===0?10:w%10),nextElite=5-(w%5===0?5:w%5);

function infAfterWin(B){
 const w=S.inf.wave;S.inf.wave=w+1;
 const heal=Math.round(S.maxHp*.12),b0=S.hp;S.hp=Math.min(S.maxHp,S.hp+heal);
 S.queue=B.kind==='battle'?(w%2===1?['tower']:['relic']):['relic','tower'];
 if(w%3===0)S.inf.shopReady=true;
 S.lastGain.notes.push(`웨이브 ${w} 돌파${S.hp>b0?` · 성 체력 +${Math.round(S.hp-b0)}`:''}${w%3===0?' · 보급 상점 개방':''}`);
 S.scr={t:'queue'};hud();nextReward(true);
}
const buildSnap=()=>({towers:S.towers.map(t=>({k:t.key,s:t.star})),relics:S.relics.slice()});
const buildHtml=b=>b?`<div class="dim" style="font-size:12px;font-family:var(--f11);margin-top:4px">타워: ${b.towers.map(t=>DEF(t.k)?DEF(t.k).n+(t.s>1?'★'+t.s:''):t.k).join(', ')||'없음'}</div><div class="dim" style="font-size:12px;font-family:var(--f11);margin-top:4px">유물: ${b.relics.map(id=>{const r=RELICS.find(x=>x.id===id);return r?r.n:id;}).join(', ')||'없음'}</div>`:'<div class="dim">기록된 빌드가 없습니다.</div>';
function showInfEnd(){
 const done=Math.max(0,S.inf.wave-1),kills=S.kills-S.inf.start;
 S.scr=null;clearRun();FAV.clear();saveFav();UI.battle=null;
 META.inf=META.inf||{best:0,kills:0,runs:0,build:null,bestKills:0};
 let dup=false;if(S.rid){META.done=META.done||[];if(META.done.includes(S.rid))dup=true;else{META.done.push(S.rid);if(META.done.length>30)META.done.shift();}}
 const prev=META.inf.best;let data=0,rec=false;
 if(!dup){META.inf.runs++;if(done>prev){data=(done-prev)*6;META.inf.best=done;META.inf.build=buildSnap();rec=true;}
  if(kills>(META.inf.bestKills||0))META.inf.bestKills=kills;META.data+=data;saveMeta();}
 const snap=buildSnap();hud();
 setView(`<h2 class="${rec?'':'bad'}">${rec?'신기록!':'무한 모드 종료'}</h2>
  <div class="panel"><b class="warn" style="font-size:18px">${done}웨이브 돌파</b><br>
   처치 ${kills} · 이전 기록 ${prev}웨이브${rec?` → <b class="warn">${done}웨이브</b>`:''}<br>
   획득 업적 포인트 <b>+${data}</b> (신기록을 넘긴 웨이브마다 6포인트) · 보유 ${META.data}
   <div class="tn" style="margin-top:8px">이번 빌드</div>${buildHtml(snap)}</div>
  <button class="btn" data-act="start">다시 출격</button><button class="btn" data-act="title">타이틀</button>`);
}
function showInfRecord(){
 const m=META.inf||{best:0,runs:0,bestKills:0,build:null};
 setView(`<h2>무한 모드 기록</h2><div class="panel"><b class="warn" style="font-size:18px">최고 ${m.best}웨이브</b><br>도전 ${m.runs}회 · 한 판 최다 처치 ${m.bestKills||0}<div class="tn" style="margin-top:8px">최고 기록 빌드</div>${buildHtml(m.build)}</div><button class="btn" data-act="title">돌아가기</button>`);
}
